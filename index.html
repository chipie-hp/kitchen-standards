<script>
const SITES=["JTI","Junior Canteen","Senior Canteen"];
const CATS=[
{n:"Equipment",s:"EQUIPMENT",stop:"equipment is unsafe or has a gas or electrical fault. Stop using it, tell the supervisor, and do not use it again until it is repaired and safe.",q:["Is all equipment working and free from damage before use?","Is damaged or unsafe equipment kept out of use?","Is equipment cleaned after use?","Is equipment put back in its place after use?","Do only trained staff use the special machines?","Are safety guards and covers in place on machines?","Are faults and missing items reported to the supervisor straight away?","Is the fridge and freezer temperature checked and in the safe range?"]},
{n:"Safety & Hygiene",s:"SAFETY & HYGIENE",stop:"gas leak, fire risk, electrical danger, an injury, or a dirty table, board or utensil touching food. Make it safe and report it.",q:["#Staff hygiene","Is everyone in the correct uniform and non-slip shoes?","Is hair covered with a hairnet or hat?","Did staff wash hands before food prep and after raw meat?","#Safety","Are floors dry, with spills cleaned up straight away?","Are knives carried and stored safely (not left in the sink)?","Are fire and gas safety rules followed?","Are emergency exits clear of boxes and equipment?","Are chemicals kept away from food?","Are accidents and hazards reported straight away?","#Cleanliness","Are the tables where prepared food is placed clean?","Are the chopping boards used for food clean?","Are knives and utensils clean?","Are sinks and hand wash basins clean?","Is \"clean as you go\" followed while working?","Are work surfaces wiped and sanitised between tasks?","Are cookers, ovens and fridges clean?","Are walls, floors and drains clean?","Is the cleaning schedule followed and signed?","Is the kitchen left clean at the end of the shift?"]},
{n:"Food & Quality",s:"FOOD & QUALITY",stop:"food smells or looks bad, or the fridge or freezer is too warm. Set the food aside and tell the supervisor.",q:["#Raw check (before preparation)", "Does the quantity match the order, and are the expiry dates still good?", "Is the packaging whole, with no damage, leaks or swelling?", "Does the food smell fresh and have a normal colour?", "Are rotten or damaged fresh foods removed and thrown away before cooking?", "#Meat, chicken, offals and liver", "Is the beef fresh (no bad smell, no slime, normal colour)?", "Is the chicken fresh and kept cold (never left out on the table)?", "Are offals washed until clean and is the liver fresh (firm, no green or dark spots)?", "#Vegetables and dry foods", "Are the cabbage and green vegetables fresh (no rot, slime, yellow or wilted leaves)?", "Is the rice sorted and washed before cooking?", "Is the maize flour good (no lumps, insects or bad smell)?", "#Preparation and handling", "Are all fresh foods washed before cutting or cooking?", "Are raw and cooked foods, and their boards and knives, kept apart?", "Are the recipe, portion sizes and weights followed?", "Is returned or leftover food handled correctly (not cooked again or reused)?", "#Quality test before serving", "Was the food tasted by the chef or supervisor before serving?", "Did the taste, seasoning and texture pass?", "Is hot food served hot?", "#Rotten food", "Was the kitchen free from rotten or spoiled food today?", "Was any rotten food kept apart, counted or weighed, and not reused?"]},
{n:"Store",s:"STORE",stop:"stock is spoiled, expired or contaminated. Take it out of use and record it.",q:["Are all items stored off the floor?","Are items labelled with name and date?","Is the store clean and dry?","Is first in, first out (FIFO) being followed, with the oldest stock used first?","Is expired stock removed and recorded?","Is stock given out only when someone asks for it?","Is every item given out written in the record (item and amount)?","Are unused items returned to the store and recorded?","Is the store locked, with only allowed people going in?","Is the store free from pests (flies, cockroaches, rats)?"]},
{n:"Wastage & Disposal",s:"WASTAGE & DISPOSAL",stop:"unsafe food is being kept or reused to avoid waste. Throw it away and record it.",q:["Was the amount cooked worked out from the planned number of guests, and adjusted when guest numbers changed?","Is all waste (peelings, trimmings, leftovers, burnt food and any other waste) thrown in the correct bin?","Is food waste, burnt food and kitchen canteen waste written in the waste log in kg?","If there were leftovers, was the reason looked for and written down?","Are the bins covered and emptied before they overflow?","Is the waste area free from pests (flies, cockroaches, rats)?"]}];
let DB;try{DB=JSON.parse(localStorage.getItem("bsg"))}catch(e){}
DB=DB||{users:[{id:1,name:"Admin",pin:"1234",role:"admin",site:SITES[0],cats:[],reason:""}],rec:{},log:[]};
function migrateQ(o){o=o||DB;
 const mapRec=(M,cat)=>{const rm=r=>{if(!r||typeof r!="object")return;if(r.a){const n={};for(const i in r.a)if(M[i]!=null)n[M[i]]=r.a[i];r.a=n}
  if(Array.isArray(r.old))r.old=r.old.filter(x=>M[x.i]!=null).map(x=>({...x,i:M[x.i]}));
  if(Array.isArray(r.h))r.h=r.h.filter(x=>M[x.i]!=null).map(x=>({...x,i:M[x.i]}));
  if(Array.isArray(r.prev))r.prev.forEach(rm)};
  for(const k in (o.rec||{}))if(k.split("|")[2]===cat)rm(o.rec[k])};
 if(!(o.qv>=2))mapRec({0:0,2:2,3:3,6:1,7:4,8:5},"4");
 if(!(o.qv>=3)){mapRec({2:1,4:2,3:3,6:4,8:6,9:7,10:8,14:10,17:11,19:12,21:14,23:15,26:16,29:17,31:19,32:20,33:21,35:23,36:24},"2");if(o.cfg)o.cfg={crit:{},ev:{},min:o.cfg.min,rebuild:1}}
 o.qv=3}
migrateQ();

DB.fb=DB.fb||{};DB.waste=DB.waste||{};DB.cfg=DB.cfg||null;DB.stop=DB.stop||{};DB.mc=DB.mc||{};
const save=()=>{try{localStorage.setItem("bsg",JSON.stringify(DB))}catch(e){}syncSoon()};
/* ---- automatic cloud sync: the Vercel /api functions talk to Supabase. Nothing to type: your login PIN is the key. ---- */
const WEB=/^https?:$/.test(location.protocol),SYA=()=>WEB&&me?{uid:me.id,pin:me.pin}:null;
let SYT=null,SYB=false,SYS={st:"off",m:"",err:""},SRVU=[];
const syncSoon=()=>{if(!SYA())return;clearTimeout(SYT);SYT=setTimeout(syncNow,4000)};
async function api(op,body){const c=SYA();if(!c)throw new Error("not logged in");const r=await fetch("/api/"+(op=="pull"||op=="push"?"sync":"photo"),{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...body,op,uid:c.uid,pin:c.pin})});let j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.message||j.error||("HTTP "+r.status));return j}
function mergeDB(s,l,first){
  const m=o=>({...(s[o]||{}),...(l[o]||{})}),u=new Map();
  (first?[...(l.users||[]),...(s.users||[])]:[...(s.users||[]),...(l.users||[])]).forEach(x=>u.set(x.id,x));
  const lg2=new Map();[...(s.log||[]),...(l.log||[])].forEach(x=>lg2.set(x.at+"|"+x.by+"|"+x.t,x));
  return{users:[...u.values()],rec:m("rec"),fb:m("fb"),waste:m("waste"),stop:m("stop"),mc:m("mc"),cfg:l.cfg||s.cfg||null,qv:3,log:[...lg2.values()].sort((a,b)=>a.at<b.at?-1:1)}}
async function upPhotos(){let all=[];try{all=await phAll()}catch(e){return}for(const o of all.filter(x=>!x.up)){const b64=await new Promise(ok=>{const fr=new FileReader();fr.onload=()=>ok(String(fr.result).split(",")[1]);fr.readAsDataURL(o.blob)});await api("upload",{name:o.path,b64});o.up=1;await phPut(o)}}
const syncChip=()=>SYA()?`<span class="sy ${SYS.st}" onclick="syncTap()">● ${esc(SYS.m||"Sync")}</span>`:"";
function syncUI(){const e=document.querySelector("#h .sy");if(e){e.className="sy "+SYS.st;e.textContent="● "+SYS.m}}
function syncTap(){if(SYS.st=="err"&&SYS.err)alert(SYS.err);syncNow()}
async function syncNow(){
  if(!SYA()||SYB||!navigator.onLine)return;SYB=true;SYS={st:"wip",m:"Syncing...",err:""};syncUI();
  try{
    for(let i=0;i<3;i++){
      const p=await api("pull",{});
      if(p.data&&p.data.users){migrateQ(p.data);Object.assign(DB,mergeDB(p.data,DB,false))}
      const r=await api("push",{data:DB,version:p.version});
      if(r.ok){SYS={st:"ok",m:"Synced "+new Date().toTimeString().slice(0,5),err:""};break}
      if(i==2)SYS={st:"wip",m:"Busy, will retry",err:""}}
    try{localStorage.setItem("bsg",JSON.stringify(DB))}catch(e){}
    try{await upPhotos()}catch(e){SYS.m+=" (photos waiting)"}
  }catch(e){SYS={st:"err",m:"Not synced",err:"Sync problem: "+e.message}}
  SYB=false;syncUI()}
async function loadSrvUsers(){if(!WEB)return;try{const r=await fetch("/api/sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({op:"users"})});if(r.ok){const j=await r.json();SRVU=(j.users||[]).map(u=>({cats:[],...u}));if(!me)render()}}catch(e){}}
const $=s=>document.querySelector(s),esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>new Date().toISOString().slice(0,10);
let me=null,V="login",ci=0,site=SITES[0],date=today(),ed=null,mA=today().slice(0,7),mB=(()=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-1);return d.toISOString().slice(0,7)})();
const shiftNow=()=>{const h=new Date().getHours();return h>=6&&h<17?"Day":"Night"},shDate=()=>{const n=new Date();if(n.getHours()<6)n.setDate(n.getDate()-1);return n.toISOString().slice(0,10)};let shift=shiftNow();const sd=(d,sh)=>(d||date)+"~"+(sh||shift),key=c=>sd()+"|"+site+"|"+c,R=c=>{const r=DB.rec[key(c)]||(DB.rec[key(c)]={a:{},sub:null});r.old=r.old||[];r.h=r.h||[];r.rounds=r.rounds||[];return r};
const qs=c=>CATS[c].q.map((t,i)=>[t,i]).filter(x=>x[0][0]!="#");
const iby=()=>R(ci).insp||me.name,inm=r=>(r&&(r.insp||(r.sub&&r.sub.by)))||"";
const lg=t=>{DB.log.push({t,by:me.name,at:new Date().toISOString()})};
function cnt(c,k){const r=DB.rec[k||key(c)];let y=0,n=0,a=0;if(r)for(const i in r.a){const v=r.a[i].v;v==0?y++:v==1?n++:a++}return{y,n,a,t:qs(c).length}}
const pc=(y,n)=>y+n?Math.round(100*y/(y+n)):null,res=p=>p==null?"-":p>=90?"Good":p>=50?"Needs improvement":"Below standard";
const mark=(p,l)=>(res(p)==l?"☒ ":"☐ ")+l;
const EV=["faults and missing items","fridge and freezer temperature","accidents and hazards","cleaning schedule","expiry dates still good","correct temperature","tasted by the chef","weighed or counted","reason written down","expired stock removed","written in the record","returned to the store","planned number of guests"],st=t=>EV.some(x=>t.includes(x)),needN=(t,a)=>a&&(a.v===1||(a.v===0&&st(t)));
/* views */
const ulabel=u=>u.name+" - "+(u.role=="inspector"?(u.cats.map(c=>CATS[c].n).join(", ")||"No category"):"All categories");
function vLogin(){return `<div class="card login"><div class="lg2">B</div><h2>BSG Kitchen Standards</h2><select id="lu" style="width:100%">${[...DB.users,...SRVU.filter(x=>!DB.users.some(u=>u.id==x.id))].map(u=>`<option value="${u.id}">${esc(ulabel(u))}</option>`).join("")}</select><input id="lp" type="password" inputmode="numeric" placeholder="PIN" style="width:100%;margin:10px 0"><button onclick="login()" style="width:100%">Log in</button><p id="le" style="color:var(--r)"></p></div>`}
async function login(){const id=$("#lu").value,pin=$("#lp").value;let u=DB.users.find(x=>x.id==id);$("#le").textContent="";
  if(WEB){try{const r=await fetch("/api/sync",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({op:"login",uid:+id,pin})});
    if(r.status==401)return $("#le").textContent="Wrong PIN";
    const j=await r.json();if(r.ok&&j.data&&j.data.users){migrateQ(j.data);Object.assign(DB,mergeDB(j.data,DB,true));try{localStorage.setItem("bsg",JSON.stringify(DB))}catch(e){}u=DB.users.find(x=>x.id==id)}}catch(e){}}
  if(u&&u.pin==pin){me=u;shift=shiftNow();date=shDate();V=u.role=="inspector"?"home":"sum";site=u.role=="inspector"?u.site:SITES[0];render();syncNow()}else $("#le").textContent="Wrong PIN"}
function vHome(){const cs=me.role=="inspector"?me.cats:CATS.map((_,i)=>i),late=sd()!=sd(shDate(),shiftNow()),un=[];
for(const k in DB.rec){const[ds,si,c]=k.split("|"),r=DB.rec[k];if(si!=site||!cs.includes(+c)||r.sub||ds==sd()||!(Object.keys(r.a).length||(r.old||[]).length))continue;un.push([ds,+c])}
return `<div class="card"><b>${esc(me.name)}</b> · ${esc(site)} · ${shift} shift · ${date}${late?' <b style="color:var(--r)">LATE ENTRY</b>':""}<div class="row" style="margin-top:8px"><input type="date" value="${date}" max="${shDate()}" onchange="date=this.value;render()"><select onchange="shift=this.value;render()">${["Day","Night"].map(x=>`<option ${x==shift?"selected":""}>${x}</option>`).join("")}</select>${late?`<button class="s" onclick="shift=shiftNow();date=shDate();render()">Current shift</button>`:""}</div></div>`+homeOpen(cs)+(un.length?`<div class="card"><b>Unfinished earlier shifts</b>${un.map(([ds,c])=>{const[d,sh]=ds.split("~");return `<div class="q" onclick="date='${d}';shift='${sh}';ci=${c};V='chk';render()"><b>${CATS[c].n}</b> · ${sh} · ${d} <span style="color:var(--r)">not closed</span></div>`}).join("")}</div>`:"")+(cs.length?cs.map(c=>{const k=cnt(c),r=DB.rec[key(c)];const dn=r&&r.sub,an=k.y+k.n+k.a,pc=k.t?Math.round(an/k.t*100):0;return `<div class="card tile" onclick="ci=${c};V='chk';render()"><div class="tl"><b>${CATS[c].n}</b><span class="pill ${dn?"ok":an?"wip":""}">${dn?"Closed":an?"In progress":"Not started"}</span></div><div class="pg"><i style="width:${dn?100:pc}%"></i></div><span class="m">${dn?"Closed by "+esc(r.sub.by):an+" of "+k.t+" answered"}</span></div>`}).join(""):`<div class="card">No category assigned. Ask your manager.</div>`)}

const dbSize=()=>{try{return JSON.stringify(DB).length}catch(e){return 0}};
function backupDl(){
  if(!me)return;
  const d=new Date(),stamp=d.toISOString().slice(0,16).replace(/[:T]/g,"-");
  lg("Backup downloaded ("+(dbSize()/1024).toFixed(1)+" KB)");
  save();
  const pack={app:"BSG Kitchen Standards",format:3,at:d.toISOString(),site:site,by:me.name,db:DB};
  dl(new Blob([JSON.stringify(pack,null,1)],{type:"application/json"}),"BSG_Backup_"+stamp+".json");
  popup({t:"Backup file downloaded.\n\nKeep it safe (email, USB, cloud). Use Restore to put this data back on any phone, tablet or computer.",b:[["OK"]]});
}
function restoreFile(inp){
  const f=inp.files&&inp.files[0];inp.value="";
  if(!f)return;
  if(f.size>8*1024*1024)return alert("That file is too big to be a BSG backup.");
  const rd=new FileReader();
  rd.onerror=()=>alert("Could not read that file.");
  rd.onload=()=>{
    let o;try{o=JSON.parse(rd.result)}catch(e){return alert("That file is not a backup (it is not valid JSON).")}
    const d=(o&&o.db)?o.db:o;
    if(!d||typeof d!=="object"||!Array.isArray(d.users)||!d.users.length)return alert("That file does not look like a BSG backup (no users inside).");
    popup({t:"Restore this backup?\n\n"+(o&&o.at?"Taken: "+String(o.at).slice(0,16).replace("T"," ")+"\n":"")+d.users.length+" user(s) · "+Object.keys(d.rec||{}).length+" checklist session(s) · "+Object.keys(d.waste||{}).length+" waste day(s)\n\nEverything saved in this browser will be REPLACED and you will be logged out.",b:[["Cancel"],["Restore",()=>doRestore(d)]]});
  };
  rd.readAsText(f);
}
function doRestore(d){
  const keep={users:d.users,rec:d.rec,log:d.log,fb:d.fb,waste:d.waste,cfg:d.cfg,stop:d.stop,mc:d.mc,qv:d.qv};
  DB={users:[],rec:{},log:[],fb:{},waste:{},cfg:null,stop:{},mc:{}};
  ["users","rec","log","fb","waste","cfg","stop","mc","qv"].forEach(k=>{if(keep[k]!=null)DB[k]=keep[k]});
  DB.rec=DB.rec||{};DB.log=DB.log||[];DB.fb=DB.fb||{};DB.waste=DB.waste||{};DB.stop=DB.stop||{};DB.mc=DB.mc||{};migrateQ();initCfg();
  DB.users=DB.users.filter(u=>u&&u.id!=null&&u.name).map(u=>({
    id:u.id,name:String(u.name),pin:String(u.pin||""),
    role:["inspector","manager","admin"].indexOf(u.role)>=0?u.role:"inspector",
    site:SITES.indexOf(u.site)>=0?u.site:SITES[0],
    cats:Array.isArray(u.cats)?u.cats.filter(c=>c>=0&&c<CATS.length):[],
    reason:u.reason||""
  }));
  if(!DB.users.length)return alert("That backup has no usable users. Nothing was changed.");
  if(!DB.cfg||typeof DB.cfg!=="object"||!DB.cfg.ev||!DB.cfg.crit||!DB.cfg.min)DB.cfg=null;
  initCfg();
  save();
  me=null;V="login";ci=0;ed=null;RV=null;POP=null;
  render();
  popup({t:"Backup restored. Log in with a PIN from the restored backup.",b:[["OK"]]});
}

          const r=d.cell.raw;
          if(d.section==="body"&&r&&r._box!==undefined){
            const s=3.4,x=d.cell.x+d.cell.width/2-s/2,yy=d.cell.y+d.cell.height/2-s/2;
            pdf.setDrawColor(0,0,0);pdf.setLineWidth(.3);pdf.rect(x,yy,s,s);
            if(r._box){pdf.line(x+.6,yy+.6,x+s-.6,yy+s-.6);pdf.line(x+s-.6,yy+.6,x+.6,yy+s-.6)}
          }}
      });
      y=pdf.lastAutoTable.finalY+3};
    [...pd.children].forEach(e=>{
      const tg=e.tagName;
      if(tg==="TABLE")table(e);
      else if(tg==="SMALL")para(txt(e),8,"bold",[102,102,102],1);
      else if(tg==="H1"){para(txt(e),19,"bold",GREEN,0.5);pdf.setDrawColor(GREEN[0],GREEN[1],GREEN[2]);pdf.setLineWidth(.6);pdf.line(M,y,PW-M,y);y+=3}
      else if(tg==="H3"){y+=2;para(txt(e),11,"bold",GREEN,1)}
      else if(e.classList.contains("stop"))stopBox(e);
      else{const t=txt(e).trim();if(t)para(t,9.5,tg==="P"&&e.querySelector("i")?"italic":"normal",[0,0,0],2)}
    });
    const n=pdf.getNumberOfPages();
    for(let i=1;i<=n;i++){pdf.setPage(i);pdf.setFont("helvetica","normal");pdf.setFontSize(7);pdf.setTextColor(120,120,120);pdf.text("Page "+i+" of "+n,PW-M,PH-6,{align:"right"})}
    const nm=("BSG_"+(RV.name||"Report")+"_"+site.replace(/ /g,"")+"_"+date).replace(/[^\w.\-]/g,"_");
    pdf.save(nm+".pdf");
  }catch(e){
    console.error("PDF error:",e);
    appConfirm("The PDF could not be built. Open the Print screen instead? (Choose Save as PDF.)",()=>doc(RV.h,"print",RV.name));
  }
  PDFBUSY=false;
}

const sCnt=q=>{const v=Object.values(q.a);return{y:v.filter(a=>a.v===0).length,n:v.filter(a=>a.v===1).length}};
function vSess(){const r=R(ci),S=sessOf(r),mg=me.role!="inspector";return `<div class="card"><b>Sessions today (${S.length})</b>${S.map((q,n)=>{const c=sCnt(q);return `<div class="q"><b>Session ${n+1}</b> · ${esc(q.by||"-")} · started ${q.start?hm(q.start):"-"}${q.sub?" · closed "+q.sub.at.slice(11,16):' · <b style="color:var(--r)">OPEN</b>'}<div class="m">${c.y} YES · ${c.n} NO · ${q.rounds.length} round(s)</div>${q.cur&&!q.sub?`<button style="margin-top:6px" onclick="submit()">Submit and lock</button>`:""}${q.cur&&q.sub?`<div class="row" style="margin-top:6px"><button onclick="startSession()">Start new session</button>${mg?`<button class="s" onclick="reopen()">Reopen</button>`:""}</div>`:""}</div>`}).join("")||'<div class="m">No session yet</div>'}</div>`}

const mins=CATS.map((C,c)=>{const m=DB.cfg.min[c]||0,r=DB.rec[key(c)],n=r?sessOf(r).filter(q=>q.sub).length:0;return m?`<div class="m">${C.n}: ${n} of ${m} required session(s) closed</div>`:""}).join("");
return `<div class="card row"><select onchange="site=this.value;render()">${SITES.map(x=>`<option ${x==site?"selected":""}>${x}</option>`).join("")}</select><select onchange="shift=this.value;render()">${["Day","Night"].map(x=>`<option ${x==shift?"selected":""}>${x}</option>`).join("")}</select><button class="s" onclick="date=dAdd(date,-1);render()">◀</button><input type="date" value="${date}" onchange="date=this.value;render()"><button class="s" onclick="date=dAdd(date,1);render()">▶</button></div><div class="card"><b>Sessions conducted · ${shift} · ${date}</b>${Object.entries(tot).map(([w,o])=>`<div class="m">${esc(w)}: ${o.n} session(s) (${Object.entries(o.c).map(([a,b])=>a+" "+b).join(", ")})</div>`).join("")||'<div class="m">None</div>'}${mins}<table><tr><th>Area</th><th>#</th><th>Inspector</th><th>Start</th><th>Closed</th><th>Y/N</th></tr>${rows.join("")}</table></div>`}
function ptime(i,k,v){const rr=R(ci);if(rr.sub&&me.role=="inspector")return;const a=rr.a[i];if(!a||!a.p)return;if(!v){if(k=="repat"){a.p.repat=0;a.p.act=repAct(a.p);save();render()}return}const d=new Date(date+"T"+v+":00");if(shift=="Night"&&+v.slice(0,2)<6)d.setDate(d.getDate()+1);const o=a.p[k];a.p[k]=d.getTime();if(k=="repat"&&a.p.rep)a.p.act=repAct(a.p);lg("Time adjusted ("+k+") "+CATS[ci].n+" Q"+(i+1)+", "+date+": "+(o?hm(o):"-")+" to "+v);save();render()}
